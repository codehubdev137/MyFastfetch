# Neofetch Custom Aesthetic Config
# Optimized for CachyOS / Arch + Hyprland + Kitty + Nerd Font

print_info() {
    prin ""
    prin "$(color 6)╭─────────────$(color 4) System Info $(color 6)─────────────╮"
    info " $(color 5)  User" title
    info " $(color 4)  OS" distro
    info " $(color 2)  Kernel" kernel
    info " $(color 3)  Uptime" uptime
    info " $(color 6)  Shell" shell
    info " $(color 1)  WM" wm
    info " $(color 4)  Terminal" term
    info " $(color 5)  Font" term_font
    info " $(color 2)  Packages" packages
    prin "$(color 6)├─────────────$(color 4) Hardware $(color 6)────────────┤"
    info " $(color 3)  Host" model
    info " $(color 1)  CPU" cpu
    info " $(color 5)﬙  GPU" gpu
    info " $(color 2)󰍛  Memory" memory
    info " $(color 6)󰍹  Display" resolution
    prin "$(color 6)╰──────────────────────────────────────╯"
    prin ""
    prin "  $(color 1)  $(color 2)  $(color 3)  $(color 4)  $(color 5)  $(color 6)  $(color 7)  $(color 8)"
    prin ""
}

# Title
title_fqdn="off"

# Kernel
kernel_shorthand="on"

# Distro
distro_shorthand="off"
os_arch="off"

# Uptime
uptime_shorthand="tiny"

# Memory
memory_percent="on"
memory_unit="gib"

# Packages
package_managers="on"

# Shell
shell_path="off"
shell_version="on"

# CPU
speed_type="bios_limit"
speed_shorthand="on"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"

# GPU
gpu_brand="on"
gpu_type="all"

# Resolution
refresh_rate="on"

# Colors & Formatting
colors=(distro)
bold="on"
underline_enabled="on"
underline_char="-"
separator=" $(color 8)❯$(color 7)"

# Color Blocks
color_blocks="off"
block_width=3
block_height=1
col_offset="auto"

# Progress Bars
bar_char_elapsed="-"
bar_char_total="="
bar_border="on"
bar_length=15
bar_color_elapsed="distro"
bar_color_total="distro"
cpu_display="off"
memory_display="off"
battery_display="off"
disk_display="off"

# Backend & ASCII
image_backend="ascii"
image_source="auto"
ascii_distro="auto"
ascii_colors=(distro)
ascii_bold="on"

# Image loop / misc
image_loop="off"
crop_mode="normal"
crop_offset="center"
image_size="auto"
gap=3
yoffset=0
xoffset=0
stdout="off"
